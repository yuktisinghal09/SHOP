<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>
  <!-- Royal Paisley / Kalash Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="35" cy="35" r="32" fill="#7d3345" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <circle cx="35" cy="35" r="28" fill="none" stroke="url(#goldGrad)" stroke-dasharray="2 3" stroke-width="0.9"/>
    <!-- Decorative HP monogram (Heeralal Pannalal) -->
    <text x="35" y="43" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">HP</text>
    <path d="M35 8 L37 14 L43 14 L38 18 L40 24 L35 20 L30 24 L32 18 L27 14 L33 14 Z" fill="url(#goldGrad)" opacity="0.85" transform="scale(0.5) translate(35,-2)"/>
  </g>
  <!-- Typography -->
  <g transform="translate(95, 20)">
    <text x="0" y="22" font-family="Georgia, 'Playfair Display', serif" font-size="18" font-weight="700" fill="#7d3345" letter-spacing="1.6">HEERALAL PANNALAL</text>
    <text x="0" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#9b763b" letter-spacing="4">SAREE EMPORIUM • MATHURA</text>
    <line x1="0" y1="46" x2="285" y2="46" stroke="url(#goldGrad)" stroke-width="1" opacity="0.55"/>
    <text x="0" y="57" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#7e6f67" letter-spacing="1.5">SAREES • LEHENGAS • SUITS • FESTIVE WEAR</text>
  </g>
</svg>